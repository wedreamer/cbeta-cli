[package]
name = "cbeta-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Human-first CBETA search CLI (MCP is cbeta serve)"

[[bin]]
name = "cbeta"
path = "src/main.rs"

[dependencies]
cbeta-core.workspace = true
cbeta-parse.workspace = true
cbeta-index.workspace = true
cbeta-search.workspace = true
clap.workspace = true
clap_complete.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
# MCP stdio + streamable HTTP (L-mcp / L-http).
rmcp = { version = "3", default-features = false, features = ["server", "macros", "transport-io", "transport-streamable-http-server"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "sync", "net", "io-util", "time", "signal"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
tokio-util = { version = "0.7", default-features = false, features = ["rt"] }
schemars = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tower = { version = "0.5", default-features = false, features = ["util"] }
http-body-util = "0.1"

[lints]
workspace = true
