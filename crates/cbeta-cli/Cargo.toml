[package]
name = "cbeta-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Human-first CBETA search CLI (MCP is cbeta serve)"

[[bin]]
name = "cbeta"
path = "src/main.rs"

[dependencies]
cbeta-core.workspace = true
cbeta-parse.workspace = true
cbeta-index.workspace = true
cbeta-search.workspace = true
clap.workspace = true
clap_complete.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
# MCP stdio server (L-mcp). server pulls schemars; transport-io = stdin/stdout pair.
rmcp = { version = "3", default-features = false, features = ["server", "macros", "transport-io"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "sync"] }
schemars = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[lints]
workspace = true
