[workspace]
resolver = "2"
members = [
    "crates/cbeta-core",
    "crates/cbeta-parse",
    "crates/cbeta-index",
    "crates/cbeta-search",
    "crates/cbeta-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/wedreamer/cbeta-cli"
authors = ["wedreamer"]

[workspace.dependencies]
cbeta-core = { path = "crates/cbeta-core" }
cbeta-parse = { path = "crates/cbeta-parse" }
cbeta-index = { path = "crates/cbeta-index" }
cbeta-search = { path = "crates/cbeta-search" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
clap = { version = "=4.5.23", features = ["derive"] }

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
